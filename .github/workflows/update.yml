name: Update VNDB data

on:
  schedule:
    - cron: "0 20 * * *"   # 每天 UTC 20:00（北京时间次日 04:00）
  workflow_dispatch:        # 允许手动运行

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch VNDB list
        run: node scripts/fetch-vndb.mjs
        env:
          VNDB_USER: ${{ vars.VNDB_USER }}
          VNDB_TOKEN: ${{ secrets.VNDB_TOKEN }}   # 私密列表必填
          PUBLIC_LABELS: ${{ vars.PUBLIC_LABELS }}  # 必填：要公开的标签名，逗号分隔
      - name: Merge Notion databases
        run: node scripts/merge-notion.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_A: ${{ vars.NOTION_DB_A }}
          NOTION_DB_B: ${{ vars.NOTION_DB_B }}
          NOTION_DB_C: ${{ vars.NOTION_DB_C }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "chore: update vndb data"
          git push
      - name: Trigger Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
