<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的 VNDB 列表</title>
<style>
:root{--bg:#f2f4f7;--card:#fff;--ink:#1c2230;--sub:#667085;--line:#dde2ea;--acc:#1f6f78;--accbg:#e1f0f1}
@media(prefers-color-scheme:dark){:root{--bg:#12161d;--card:#1b212b;--ink:#e8ebf0;--sub:#98a2b3;--line:#2b3340;--acc:#6cc4cc;--accbg:#1d3338}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:1080px;margin:0 auto;padding:32px 16px 64px}
h1{margin:0;font-size:28px;letter-spacing:.02em}
.meta{color:var(--sub);font-size:13px;margin:4px 0 20px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
input[type=search],select{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
input[type=search]{flex:1;min-width:160px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
.chip{font:inherit;font-size:13px;padding:3px 12px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--ink);cursor:pointer}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.chip:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.cover{aspect-ratio:3/4;background:var(--line);overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.body{padding:8px 10px 10px;display:flex;flex-direction:column;gap:4px;flex:1}
.title{font-weight:600;font-size:14px;line-height:1.4;color:var(--ink);text-decoration:none}
.title:hover{color:var(--acc)}
.sub{font-size:12px;color:var(--sub)}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto}
.tag{font-size:12px;padding:0 8px;border-radius:4px;background:var(--accbg);color:var(--acc)}
.vote{font-size:12px;font-weight:600}
.empty{grid-column:1/-1;color:var(--sub)}
.btns{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.btn{font-size:12px;padding:1px 8px;border:1px solid var(--line);border-radius:4px;color:var(--ink);text-decoration:none}
.btn:hover{border-color:var(--acc);color:var(--acc)}
</style>
</head>
<body>
<main>
  <h1>我的 VNDB 列表</h1>
  <p class="meta" id="meta">加载中…</p>
  <div class="bar">
    <input type="search" id="q" placeholder="搜索标题" aria-label="搜索标题">
    <select id="sort" aria-label="排序">
      <option value="lastmod">最近更新</option>
      <option value="vote">我的评分</option>
      <option value="released">发售日期</option>
      <option value="title">标题</option>
    </select>
  </div>
  <div class="chips" id="chips"></div>
  <div id="grid"></div>
</main>
<script>
const $ = s => document.querySelector(s);
const ST = { play: "在玩", done: "已完成", wish: "愿望单" };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const vers = r => [...new Set(r.map(x => [x.platforms.join("/").toUpperCase(), x.langs.join("/")]
  .filter(Boolean).join(" ")).filter(Boolean))].join("；");
const btns = i => {
  const l = i.links || {}, b = [];
  (l.notion || []).forEach(n => b.push(["Notion", n.url]));
  (l.store || []).forEach(s => b.push([s.label, s.url]));
  (l.guide || []).forEach(u => b.push(["攻略", u]));
  if (l.vndb) b.push(["VNDB", "https://vndb.org/" + l.vndb]);
  return b.map(([t, u]) => `<a class="btn" href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a>`).join("");
};
let items = [], label = "", sortKey = "lastmod";

fetch("data.json?t=" + Date.now(), { cache: "no-store" }).then(r => { if (!r.ok) throw 0; return r.json(); }).then(d => {
  items = d.items || [];
  $("#meta").textContent = `共 ${items.length} 条，数据更新于 ${new Date(d.updated).toLocaleString("zh-CN")}`;
  buildChips(); render();
}).catch(() => {
  $("#meta").textContent = "";
  $("#grid").innerHTML = '<p class="empty">还没有 data.json。请先到仓库的 Actions 页面手动运行一次 “Update VNDB data”。</p>';
});

function buildChips() {
  const box = $("#chips");
  box.innerHTML = "";
  [["", `全部 ${items.length}`], ...Object.keys(ST).map(k => [k, `${ST[k]} ${items.filter(i => i.status === k).length}`])].forEach(([v, t]) => {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = t;
    b.setAttribute("aria-pressed", v === label);
    b.onclick = () => { label = v; buildChips(); render(); };
    box.appendChild(b);
  });
}

function render() {
  const q = $("#q").value.trim().toLowerCase();
  const cmp = {
    lastmod: (a, b) => b.lastmod - a.lastmod,
    vote: (a, b) => (b.vote || 0) - (a.vote || 0),
    released: (a, b) => (b.released || "").localeCompare(a.released || ""),
    title: (a, b) => a.title.localeCompare(b.title, "ja")
  }[sortKey];
  const list = items
    .filter(i => (!label || i.status === label) && (!q || (i.title + " " + i.subtitle).toLowerCase().includes(q)))
    .sort(cmp);
  $("#grid").innerHTML = list.length ? list.map(i => `<article class="card">
      <div class="cover">${i.cover ? `<img src="${esc(i.cover)}" alt="" loading="lazy">` : ""}</div>
      <div class="body">
        <span class="title">${esc(i.title)}</span>
        ${i.subtitle ? `<span class="sub">${esc(i.subtitle)}</span>` : ""}
        <span class="sub">${esc(i.released || "")}</span>
        ${i.releases && i.releases.length ? `<span class="sub">${esc(vers(i.releases))}</span>` : ""}
        ${i.vote ? `<span class="vote">${(i.vote / 10).toFixed(1)} 分</span>` : ""}
        <div class="tags"><span class="tag">${esc(ST[i.status] || "")}</span>${i.sub ? `<span class="tag">${esc(i.sub)}</span>` : ""}</div>
        <div class="btns">${btns(i)}</div>
      </div></article>`).join("") : '<p class="empty">没有符合条件的条目。</p>';
}

$("#q").oninput = render;
$("#sort").onchange = e => { sortKey = e.target.value; render(); };
</script>
</body>
</html>
